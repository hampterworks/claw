# Deploys the multiplayer relay (server/) to Cloudflare Workers.
# Needs two repo secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy multiplayer server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Workers need a <name>.workers.dev subdomain on the account. Register one if missing.
      - name: Make sure the account has a workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          cur=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -n "$cur" ]; then echo "workers.dev subdomain: $cur"; exit 0; fi
          for name in hampterworks hampterworks-claw claw-ohio-$(date +%s); do
            res=$(curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$name\"}" "$api")
            if [ "$(echo "$res" | jq -r '.success')" = "true" ]; then echo "Registered $name.workers.dev"; exit 0; fi
            echo "Could not use $name: $(echo "$res" | jq -c '.errors')"
          done
          echo "::error::Could not register a workers.dev subdomain. Check the API token has the 'Edit Cloudflare Workers' permissions."
          exit 1
      - name: Deploy claw-ohio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          # the action's default (3.90) can't read wrangler.jsonc; this is the version tested locally
          wranglerVersion: '4.147.0'
