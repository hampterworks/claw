# One-off: deletes the multiplayer relay (claw-ohio) and its Durable Object data from Cloudflare.
# The project is shutting down; the repo is archived after this runs.
name: Delete multiplayer server

on:
  push:
    paths:
      - '.github/workflows/delete-worker.yml'
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete claw-ohio
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/claw-ohio"
          auth="Authorization: Bearer $CF_TOKEN"
          curl -s -X DELETE -H "$auth" "$api?force=true" | jq -c '{success, errors}'
          # read back: the script must be gone (Cloudflare answers 404)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$api")
          echo "GET claw-ohio: $code"
          [ "$code" = 404 ]
