# Deploys the multiplayer relay (server/) to Cloudflare Workers.
# Needs two repo secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy multiplayer server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Workers live at claw-ohio.<subdomain>.workers.dev. Use (or rename to) a group name so
      # nobody's personal account name ends up in the game's URL.
      - name: Set the workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WANTED: hampterworks hampter-claw glorp-ohio
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain"
          auth="Authorization: Bearer $CF_TOKEN"
          put() { curl -s -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$1\"}" "$api" | jq -r '.success'; }
          cur=$(curl -s -H "$auth" "$api" | jq -r '.result.subdomain // empty')
          for name in $WANTED; do
            if [ "$cur" = "$name" ]; then echo "workers.dev subdomain: $cur"; exit 0; fi
          done
          # an existing subdomain can't be renamed in place: delete it, then register a group name
          if [ -n "$cur" ]; then
            curl -s -X DELETE -H "$auth" "$api" | jq -c '{success, errors}'
          fi
          for name in $WANTED; do
            if [ "$(put "$name")" = "true" ]; then echo "workers.dev subdomain: $name"; exit 0; fi
            echo "Could not use $name"
          done
          # put the old one back rather than leave the Worker unreachable (not printed: it may be a personal name)
          if [ -n "$cur" ] && [ "$(put "$cur")" = "true" ]; then echo "::warning::Kept the previous subdomain"; exit 0; fi
          echo "::error::Could not set a workers.dev subdomain. Check the API token has the 'Edit Cloudflare Workers' permissions."
          exit 1
      - name: Deploy claw-ohio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          # the action's default (3.90) can't read wrangler.jsonc; this is the version tested locally
          wranglerVersion: '4.147.0'
